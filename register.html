<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun Baru - SIJapanese Portal Pembelajaran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #D9383A;
      --red-dark: #B91C1C;
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --green: #10B981;
      --text: #0F172A;
      --text-soft: #64748B;
      --border: #CBD5E1;
      --bg: #F8FAFC;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, #EFF6FF 0%, #F8FAFC 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: var(--text);
    }
    .register-container {
      width: 100%;
      max-width: 520px;
    }
    .register-card {
      background: #FFFFFF;
      border: 1.5px solid #E2E8F0;
      border-radius: 24px;
      padding: 2.2rem 2rem;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.10);
      position: relative;
    }
    .header {
      text-align: center;
      margin-bottom: 1.6rem;
    }
    .logo-badge {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #EFF6FF;
      border: 2px solid #BFDBFE;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.85rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.15);
    }
    .logo-badge svg {
      width: 30px;
      height: 30px;
    }
    .header h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header p {
      color: var(--text-soft);
      font-size: 0.88rem;
      margin-top: 0.35rem;
    }
    .alert-box {
      padding: 0.85rem 1rem;
      border-radius: 12px;
      font-size: 0.86rem;
      font-weight: 700;
      margin-bottom: 1.25rem;
      display: none;
      align-items: flex-start;
      gap: 0.65rem;
      line-height: 1.4;
    }
    .alert-icon-svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .alert-error {
      background: #FEF2F2;
      border: 1.5px solid #FECACA;
      color: #DC2626;
    }
    .alert-success {
      background: #ECFDF5;
      border: 1.5px solid #A7F3D0;
      color: #065F46;
    }
    .form-group {
      margin-bottom: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }
    .form-group label {
      font-size: 0.86rem;
      font-weight: 700;
      color: #334155;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #FFFFFF;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-pass-wrap {
      position: relative;
      width: 100%;
    }
    .input-pass-wrap input {
      padding-right: 2.85rem;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .btn-toggle-pass {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 6px;
      cursor: pointer;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.15s ease;
    }
    .btn-toggle-pass:hover {
      color: var(--text);
    }

    /* Role Selector */
    .role-selector-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .role-option {
      cursor: pointer;
      position: relative;
    }
    .role-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .role-card-inner {
      padding: 0.85rem 0.75rem;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s ease;
      text-align: center;
    }
    .role-badge-pill {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      background: #E2E8F0;
      color: #475569;
    }
    .role-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text);
    }
    .role-desc {
      font-size: 0.72rem;
      color: var(--text-soft);
      line-height: 1.25;
    }
    .role-option input:checked + .role-card-inner {
      border-color: var(--blue);
      background: #EFF6FF;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.12);
    }
    .role-option input:checked + .role-card-inner .role-badge-pill {
      background: #DBEAFE;
      color: #1D4ED8;
    }
    .role-option.role-guru input:checked + .role-card-inner {
      border-color: var(--red);
      background: #FEF2F2;
      box-shadow: 0 4px 12px rgba(217, 56, 58, 0.12);
    }
    .role-option.role-guru input:checked + .role-card-inner .role-badge-pill {
      background: #FEE2E2;
      color: #B91C1C;
    }

    /* Avatar Grid Selector */
    .avatar-cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin-top: 0.25rem;
    }
    .avatar-card-item {
      cursor: pointer;
      position: relative;
    }
    .avatar-card-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .avatar-card-inner {
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 0.65rem 0.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      background: #F8FAFC;
      transition: all 0.2s ease;
      text-align: center;
    }
    .avatar-card-inner img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid #CBD5E1;
      object-fit: cover;
      display: block;
    }
    .avatar-card-name {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text);
    }
    .avatar-card-role {
      font-size: 0.66rem;
      color: var(--text-soft);
    }
    .avatar-card-item input:checked + .avatar-card-inner {
      border-color: var(--blue);
      background: #EFF6FF;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    .avatar-card-item.avatar-tanaka input:checked + .avatar-card-inner {
      border-color: var(--red);
      background: #FEF2F2;
      box-shadow: 0 4px 12px rgba(217, 56, 58, 0.15);
    }

    .pass-match-msg {
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 0.25rem;
      display: none;
    }
    .pass-match-msg.match {
      color: #059669;
      display: block;
    }
    .pass-match-msg.mismatch {
      color: #DC2626;
      display: block;
    }

    .btn-submit {
      width: 100%;
      padding: 0.9rem 1.2rem;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .bottom-links {
      margin-top: 1.6rem;
      padding-top: 1.25rem;
      border-top: 1.5px solid #F1F5F9;
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-soft);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .bottom-links a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .bottom-links a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      .register-card {
        padding: 1.8rem 1.3rem;
        border-radius: 20px;
      }
      .header h1 {
        font-size: 1.4rem;
      }
      .form-row-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .form-group input,
      .form-group select {
        padding: 0.8rem 0.9rem;
        font-size: 0.92rem;
      }
      .btn-submit {
        padding: 0.85rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="register-container">
    <div class="register-card">
      <div class="header">
        <div class="logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </div>
        <h1>Pendaftaran Akun Baru</h1>
        <p>Bergabung ke platform pembelajaran bahasa Jepang SIJapanese</p>
      </div>

      <!-- Alert Messages (STRICT ZERO EMOJI) -->
      <div class="alert-box alert-error" id="reg-alert-error">
        <svg viewBox="0 0 24 24" class="alert-icon-svg" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="reg-error-text">Terjadi kesalahan saat pendaftaran.</span>
      </div>
      <div class="alert-box alert-success" id="reg-alert-success">
        <svg viewBox="0 0 24 24" class="alert-icon-svg" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="reg-success-text">Akun berhasil dibuat! Mengalihkan...</span>
      </div>

      <form id="form-register" onsubmit="handleFormRegister(event)">
        <!-- Pilihan Peran Akun -->
        <div class="form-group">
          <label>Daftar Sebagai:</label>
          <div class="role-selector-wrap">
            <label class="role-option">
              <input type="radio" name="role" value="siswa" checked onchange="toggleRoleFields('siswa')" />
              <div class="role-card-inner">
                <span class="role-badge-pill">Peran Murid</span>
                <span class="role-name">Siswa Belajar</span>
                <span class="role-desc">Akses modul materi, kuis &amp; mini games</span>
              </div>
            </label>

            <label class="role-option role-guru">
              <input type="radio" name="role" value="guru" onchange="toggleRoleFields('guru')" />
              <div class="role-card-inner">
                <span class="role-badge-pill">Peran Guru</span>
                <span class="role-name">Guru Pengajar</span>
                <span class="role-desc">Akses dashboard master materi &amp; penilaian</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-name">Nama Lengkap</label>
          <input type="text" name="name" id="reg-name" placeholder="contoh: Anggata Ramadhan" required autocomplete="name" />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="reg-nisn">NISN / Nomor Induk Siswa</label>
            <input type="text" name="reg_no" id="reg-nisn" placeholder="contoh: 0071234567" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="reg-class">Kelas / Rombel</label>
            <select name="class_room" id="reg-class">
              <option value="Kelas X-A">Kelas X-A</option>
              <option value="Kelas X-B">Kelas X-B</option>
              <option value="Kelas XI-A">Kelas XI-A</option>
              <option value="Kelas XI-B">Kelas XI-B</option>
              <option value="Kelas XII">Kelas XII</option>
              <option value="Siswa Umum">Siswa Umum / Mandiri</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Alamat Email</label>
          <input type="email" name="email" id="reg-email" placeholder="contoh: siswa@sekolah.sch.id" required autocomplete="email" />
        </div>

        <!-- Pilihan Avatar Interaktif -->
        <div class="form-group">
          <label>Pilihan Karakter Avatar Belajar:</label>
          <div class="avatar-cards-grid">
            <label class="avatar-card-item">
              <input type="radio" name="avatar" value="img/avatar_anggata.svg" checked />
              <div class="avatar-card-inner">
                <img src="img/avatar_anggata.svg" alt="Anggata" />
                <span class="avatar-card-name">Anggata</span>
                <span class="avatar-card-role">Siswa Laki-laki</span>
              </div>
            </label>

            <label class="avatar-card-item">
              <input type="radio" name="avatar" value="img/avatar_aoi.svg" />
              <div class="avatar-card-inner">
                <img src="img/avatar_aoi.svg" alt="Aoi" />
                <span class="avatar-card-name">Aoi</span>
                <span class="avatar-card-role">Siswi Perempuan</span>
              </div>
            </label>

            <label class="avatar-card-item avatar-tanaka">
              <input type="radio" name="avatar" value="img/avatar_tanaka.svg" />
              <div class="avatar-card-inner">
                <img src="img/avatar_tanaka.svg" alt="Tanaka" />
                <span class="avatar-card-name">Tanaka</span>
                <span class="avatar-card-role">Sensei Guru</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="reg-pass">Kata Sandi (Min. 6 Karakter)</label>
            <div class="input-pass-wrap">
              <input type="password" name="password" id="reg-pass" placeholder="Minimal 6 karakter..." required minlength="6" autocomplete="new-password" oninput="checkPassMatch()" />
              <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility('reg-pass', this)" title="Lihat/Sembunyikan Sandi">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-pass-confirm">Konfirmasi Kata Sandi</label>
            <div class="input-pass-wrap">
              <input type="password" name="password_confirmation" id="reg-pass-confirm" placeholder="Ulangi kata sandi..." required minlength="6" autocomplete="new-password" oninput="checkPassMatch()" />
              <button type="button" class="btn-toggle-pass" onclick="togglePassVisibility('reg-pass-confirm', this)" title="Lihat/Sembunyikan Sandi">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div id="pass-match-indicator" class="pass-match-msg"></div>

        <button type="submit" class="btn-submit" id="btn-submit-reg">
          <span>Daftar Akun Baru</span>
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="bottom-links">
        <div>Sudah memiliki akun belajar? <a href="login.html">Masuk di sini</a></div>
        <div><a href="index.html">Kembali ke Beranda</a></div>
      </div>
    </div>
  </div>

  <script>
    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
      } else {
        input.type = 'password';
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
      }
    }

    function checkPassMatch() {
      const p1 = document.getElementById('reg-pass').value;
      const p2 = document.getElementById('reg-pass-confirm').value;
      const ind = document.getElementById('pass-match-indicator');
      if (!p2) {
        ind.className = 'pass-match-msg';
        ind.textContent = '';
        return;
      }
      if (p1 === p2) {
        ind.className = 'pass-match-msg match';
        ind.textContent = 'Kata sandi cocok.';
      } else {
        ind.className = 'pass-match-msg mismatch';
        ind.textContent = 'Kata sandi belum sama.';
      }
    }

    function toggleRoleFields(role) {
      const submitBtn = document.getElementById('btn-submit-reg');
      const avatarRadios = document.getElementsByName('avatar');
      if (role === 'guru') {
        submitBtn.style.background = 'linear-gradient(135deg, #D9383A 0%, #B91C1C 100%)';
        submitBtn.style.boxShadow = '0 4px 14px rgba(217, 56, 58, 0.3)';
        for (const r of avatarRadios) {
          if (r.value.includes('tanaka')) r.checked = true;
        }
      } else {
        submitBtn.style.background = 'linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%)';
        submitBtn.style.boxShadow = '0 4px 14px rgba(37, 99, 235, 0.3)';
        for (const r of avatarRadios) {
          if (r.value.includes('anggata')) r.checked = true;
        }
      }
    }

    function showRegAlert(type, text) {
      const errBox = document.getElementById('reg-alert-error');
      const succBox = document.getElementById('reg-alert-success');
      errBox.style.display = 'none';
      succBox.style.display = 'none';

      if (type === 'error') {
        document.getElementById('reg-error-text').textContent = text;
        errBox.style.display = 'flex';
      } else {
        document.getElementById('reg-success-text').textContent = text;
        succBox.style.display = 'flex';
      }
    }

    async function handleFormRegister(e) {
      e.preventDefault();
      const form = document.getElementById('form-register');
      const role = form.querySelector('input[name="role"]:checked').value;
      const name = document.getElementById('reg-name').value.trim();
      const nisn = document.getElementById('reg-nisn').value.trim();
      const classRoom = document.getElementById('reg-class').value;
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const avatarRadio = form.querySelector('input[name="avatar"]:checked');
      const avatar = avatarRadio ? avatarRadio.value : (role === 'guru' ? 'img/avatar_tanaka.svg' : 'img/avatar_anggata.svg');
      const password = document.getElementById('reg-pass').value;
      const passwordConfirm = document.getElementById('reg-pass-confirm').value;

      if (!name || !email || !password) {
        showRegAlert('error', 'Semua kolom bertanda wajib harus diisi.');
        return;
      }

      if (password !== passwordConfirm) {
        showRegAlert('error', 'Kata sandi dan konfirmasi kata sandi tidak cocok.');
        return;
      }

      if (password.length < 6) {
        showRegAlert('error', 'Kata sandi minimal harus 6 karakter.');
        return;
      }

      const submitBtn = document.getElementById('btn-submit-reg');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Mendaftarkan...</span>';

      // 1. Coba registrasi ke API Laravel jika server online
      try {
        const isLaravel = window.location.pathname.startsWith('/register') || window.location.port === '8000' || window.location.port === '8080';
        if (isLaravel) {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              name: name,
              email: email,
              password: password,
              password_confirmation: passwordConfirm,
              role: role,
              avatar: avatar,
              reg_no: nisn || undefined,
              class_room: classRoom
            })
          });

          const data = await res.json();
          if (data && data.success) {
            if (data.user) {
              localStorage.setItem('sijapanese_active_user', JSON.stringify(data.user));
              localStorage.setItem('sijapanese_auth_user', JSON.stringify(data.user));
            }
            showRegAlert('success', data.message || 'Pendaftaran berhasil! Mengalihkan...');
            setTimeout(() => {
              window.location.href = data.redirect || (role === 'guru' ? '/guru' : '/');
            }, 600);
            return;
          } else if (res.status === 422) {
            showRegAlert('error', data.message || (data.errors ? Object.values(data.errors)[0][0] : 'Data pendaftaran tidak valid.'));
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Daftar Akun Baru</span>';
            return;
          }
        }
      } catch (err) {
        // Fallback ke penyimpanan client-side
      }

      // 2. Simpan ke LocalStorage agar langsung dapat digunakan di mode offline/static
      let registeredUsers = {};
      try {
        registeredUsers = JSON.parse(localStorage.getItem('sij_registered_users')) || {};
      } catch (err) {}

      // Cegah duplikasi email yang sudah ada
      const defaultEmails = ['guru@sijapanese.sch.id', 'kenji@sijapanese.sch.id', 'aoi@sijapanese.sch.id'];
      if (defaultEmails.includes(email) || registeredUsers[email]) {
        showRegAlert('error', 'Alamat email sudah terdaftar. Silakan gunakan email lain atau langsung masuk di halaman Login.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Daftar Akun Baru</span>';
        return;
      }

      const regNo = nisn ? nisn : (role === 'guru' ? 'SIJ-2026-GURU' + Math.floor(Math.random()*900+100) : 'JFT-2026-' + Math.floor(Math.random()*90000+10000));

      const newUser = {
        name: name,
        email: email,
        password: password,
        role: role,
        avatar: avatar,
        reg_no: regNo,
        class_room: classRoom,
        nationality: 'INDONESIA',
        gender: 'Laki-laki (MALE)',
        birthdate: '2007-09-16',
        target_level: role === 'guru' ? 'Pengajar (N1 - N5)' : 'JLPT N5 (Dasar 1)',
        score: 0
      };

      registeredUsers[email] = newUser;
      localStorage.setItem('sij_registered_users', JSON.stringify(registeredUsers));
      localStorage.setItem('sijapanese_active_user', JSON.stringify(newUser));
      localStorage.setItem('sijapanese_auth_user', JSON.stringify(newUser));

      showRegAlert('success', `Akun ${role === 'guru' ? 'Guru' : 'Siswa'} berhasil dibuat! Mengalihkan ke halaman belajar...`);

      setTimeout(() => {
        if (role === 'guru') {
          window.location.href = 'guru.html';
        } else {
          window.location.href = 'index.html';
        }
      }, 700);
    }
  </script>
</body>
</html>
